name: ImageSH
options:
  bundleIdPrefix: com.alexzidros
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: 9JR2GW6CWR
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'
    TARGETED_DEVICE_FAMILY: '1'
    SHARED_KEYCHAIN_GROUP: '$(DEVELOPMENT_TEAM).com.alexzidros.imagesh.shared'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  ImageSH:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexzidros.imagesh
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/ImageSH.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: ImageSHShare
        embed: true
  ImageSHShare:
    type: app-extension
    platform: iOS
    sources:
      - Extension
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexzidros.imagesh.share
        INFOPLIST_FILE: Extension/Info.plist
        CODE_SIGN_ENTITLEMENTS: Extension/ImageSHShare.entitlements
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  ImageSHTests:
    type: bundle.unit-test
    platform: iOS
    sources: Tests
    dependencies:
      - target: ImageSH
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexzidros.imagesh.tests
        GENERATE_INFOPLIST_FILE: YES
  ImageSHUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: UITests
    dependencies:
      - target: ImageSH
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexzidros.imagesh.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ImageSH:
    build:
      targets:
        ImageSH: all
    test:
      targets:
        - ImageSHTests
        - ImageSHUITests
      gatherCoverageData: false
